name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  devenv-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.1.2 -L --accept-flake-config

      - name: Run devenv test
        run: devenv test
